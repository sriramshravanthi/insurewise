name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Generates .next/types/ (route/layout prop types like LayoutProps),
      # which tsconfig.json includes but only `next dev`/`next build`
      # produce as a side effect — needed before type-check on a fresh
      # checkout, where that directory doesn't exist yet.
      - run: npx next typegen
      - run: npm run type-check
      - run: npm test
      - run: npm run build
